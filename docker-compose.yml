
services:
  db:
    image: postgres:16-alpine
    container_name: creatorxdr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creatorxdr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-creatorxdr}
    volumes:
      - postgres_data:/var/lib/postgresql/data


    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s



  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: creatorxdr-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creatorxdr}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-creatorxdr}
      FRONTEND_ORIGIN: http://localhost:5173
      IDENTITY_STORAGE_PATH: /app/storage/identity_documents
      FLASK_DEBUG: "true"
      AUTH_DEBUG_OTP: "true"
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - identity_documents:/app/storage/identity_documents
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 5001), timeout=3); s.close()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creatorxdr-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  identity_documents:

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ subject }}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #1e293b; background-color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 580px; margin: 0 auto; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden; }
    .header { background: #0f172a; color: #ffffff; padding: 24px; text-align: center; }
    .header h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.025em; }
    .content { padding: 32px 24px; }
    .footer { padding: 20px 24px; font-size: 12px; color: #64748b; text-align: center; border-top: 1px solid #f1f5f9; }
    .badge { display: inline-block; padding: 6px 12px; font-size: 13px; font-weight: 600; border-radius: 4px; }
    .badge-approved { background-color: #dcfce7; color: #166534; }
    .badge-rejected { background-color: #fee2e2; color: #991b1b; }
    .badge-resubmit { background-color: #fef3c7; color: #92400e; }
    .otp-code { font-size: 32px; font-weight: 700; letter-spacing: 6px; color: #0284c7; background: #f0f9ff; border: 1px dashed #7dd3fc; border-radius: 6px; padding: 12px 24px; text-align: center; margin: 24px 0; }
    .button { display: inline-block; background-color: #2563eb; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 500; font-size: 14px; margin-top: 16px; }
    .note { font-size: 13px; color: #64748b; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>CreatorXDR Security</h1>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p>This is an automated security notification from CreatorXDR. Do not reply to this email.</p>
      <p>&copy; CreatorXDR Identity Protection Platform</p>
    </div>
  </div>
</body>
</html>
